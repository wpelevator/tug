services:
  registry:
    build: ./tools/docker/registry
    container_name: tug-registry-it
    ports:
      - "15000:5000"
    volumes:
      - registry-data:/var/lib/registry
      - registry-auth:/auth

  control:
    build: .
    command: control
    environment:
      PORT: 8080
      TUG_DATA_DIR: /data
      TUG_OPERATOR_TOKEN: integration-token
      TUG_REGISTRY: registry:5000
      TUG_PUSH: "false"
      TUG_REGISTRY_AUTH_PATH: /registry-auth/htpasswd
      TUG_REGISTRY_CONTAINER: tug-registry-it
    ports:
      - "18080:8080"
    volumes:
      - tug-data:/data
      - registry-auth:/registry-auth
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - registry

  provisioner:
    build: .
    entrypoint: ["node"]
    command: ["tools/scripts/integration-provision.js"]
    restart: "no"
    environment:
      TUG_CONTROL_URL: http://control:8080
      TUG_TOKEN: integration-token
      TUG_TOKEN_DIR: /tokens
      TUG_NODES: vps-a,vps-b,vps-c
    volumes:
      - node-tokens:/tokens
    depends_on:
      - control

  vps-a:
    build:
      context: .
      dockerfile: tools/docker/fake-vps/Dockerfile
    privileged: true
    environment:
      TUG_NODE_NAME: vps-a
      TUG_CONTROL_URL: http://control:8080
      TUG_REGISTRY: registry:5000
      TUG_APPLY: "true"
      TUG_POLL_INTERVAL_MS: 2000
    volumes:
      - node-tokens:/tokens:ro
      - vps-a-docker:/var/lib/docker
      - vps-a-state:/var/lib/tug
    depends_on:
      - provisioner

  vps-b:
    build:
      context: .
      dockerfile: tools/docker/fake-vps/Dockerfile
    privileged: true
    environment:
      TUG_NODE_NAME: vps-b
      TUG_CONTROL_URL: http://control:8080
      TUG_REGISTRY: registry:5000
      TUG_APPLY: "true"
      TUG_POLL_INTERVAL_MS: 2000
    volumes:
      - node-tokens:/tokens:ro
      - vps-b-docker:/var/lib/docker
      - vps-b-state:/var/lib/tug
    depends_on:
      - provisioner

  vps-c:
    build:
      context: .
      dockerfile: tools/docker/fake-vps/Dockerfile
    privileged: true
    environment:
      TUG_NODE_NAME: vps-c
      TUG_CONTROL_URL: http://control:8080
      TUG_REGISTRY: registry:5000
      TUG_APPLY: "true"
      TUG_POLL_INTERVAL_MS: 2000
    volumes:
      - node-tokens:/tokens:ro
      - vps-c-docker:/var/lib/docker
      - vps-c-state:/var/lib/tug
    depends_on:
      - provisioner

networks:
  default:
    ipam:
      config:
        - subnet: 10.89.240.0/24

volumes:
  tug-data:
  registry-data:
  registry-auth:
  node-tokens:
  vps-a-docker:
  vps-a-state:
  vps-b-docker:
  vps-b-state:
  vps-c-docker:
  vps-c-state:
