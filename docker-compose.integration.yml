services:
  registry:
    build: ./services/registry
    container_name: launchpad-registry-it
    ports:
      - "15000:5000"
    volumes:
      - registry-data:/var/lib/registry
      - registry-auth:/auth

  control:
    build: .
    command: node src/control.js
    environment:
      PORT: 8080
      LAUNCHPAD_DB: /data/launchpad.db
      LAUNCHPAD_MASTER_KEY_FILE: /data/master.key
      LAUNCHPAD_OPERATOR_TOKEN: integration-token
      LAUNCHPAD_REGISTRY: registry:5000
      LAUNCHPAD_PUSH: "true"
      LAUNCHPAD_REGISTRY_AUTH_PATH: /registry-auth/htpasswd
      LAUNCHPAD_REGISTRY_CONTAINER: launchpad-registry-it
    ports:
      - "18080:8080"
    volumes:
      - launchpad-data:/data
      - registry-auth:/registry-auth
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - registry

  provisioner:
    build: .
    command: node scripts/integration-provision.js
    restart: "no"
    environment:
      LAUNCHPAD_CONTROL_URL: http://control:8080
      LAUNCHPAD_TOKEN: integration-token
      LAUNCHPAD_TOKEN_DIR: /tokens
      LAUNCHPAD_NODES: vps-a,vps-b,vps-c
    volumes:
      - node-tokens:/tokens
    depends_on:
      - control

  vps-a:
    build:
      context: .
      dockerfile: integration/Dockerfile.fake-vps
    privileged: true
    environment:
      LAUNCHPAD_NODE_NAME: vps-a
      LAUNCHPAD_CONTROL_URL: http://control:8080
      LAUNCHPAD_APPLY: "true"
      LAUNCHPAD_POLL_INTERVAL_MS: 2000
    volumes:
      - node-tokens:/tokens:ro
      - vps-a-docker:/var/lib/docker
      - vps-a-state:/var/lib/launchpad
    depends_on:
      - provisioner

  vps-b:
    build:
      context: .
      dockerfile: integration/Dockerfile.fake-vps
    privileged: true
    environment:
      LAUNCHPAD_NODE_NAME: vps-b
      LAUNCHPAD_CONTROL_URL: http://control:8080
      LAUNCHPAD_APPLY: "true"
      LAUNCHPAD_POLL_INTERVAL_MS: 2000
    volumes:
      - node-tokens:/tokens:ro
      - vps-b-docker:/var/lib/docker
      - vps-b-state:/var/lib/launchpad
    depends_on:
      - provisioner

  vps-c:
    build:
      context: .
      dockerfile: integration/Dockerfile.fake-vps
    privileged: true
    environment:
      LAUNCHPAD_NODE_NAME: vps-c
      LAUNCHPAD_CONTROL_URL: http://control:8080
      LAUNCHPAD_APPLY: "true"
      LAUNCHPAD_POLL_INTERVAL_MS: 2000
    volumes:
      - node-tokens:/tokens:ro
      - vps-c-docker:/var/lib/docker
      - vps-c-state:/var/lib/launchpad
    depends_on:
      - provisioner

networks:
  default:
    ipam:
      config:
        - subnet: 10.89.240.0/24

volumes:
  launchpad-data:
  registry-data:
  registry-auth:
  node-tokens:
  vps-a-docker:
  vps-a-state:
  vps-b-docker:
  vps-b-state:
  vps-c-docker:
  vps-c-state:
