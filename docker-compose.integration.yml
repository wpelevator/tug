services:
  control:
    image: tug-runtime:integration
    build: .
    command: control
    environment:
      PORT: 8443
      TUG_DATA_DIR: /data
      TUG_ADVERTISE_URL: https://control:8443
    ports:
      - "127.0.0.1:${TUG_TEST_PORT:-18080}:8443"
    volumes:
      - tug-data:/data
      - /var/run/docker.sock:/var/run/docker.sock

  provisioner:
    image: tug-runtime:integration
    build: .
    entrypoint: ["node"]
    command: ["tools/scripts/integration-provision.js"]
    restart: "no"
    environment:
      TUG_CONTROL_URL: https://control:8443
      TUG_ADVERTISE_URL: https://control:8443
      TUG_DATA_DIR: /data
      TUG_TOKEN_DIR: /tokens
      TUG_NODES: vps-a,vps-b,vps-c
    volumes:
      - node-tokens:/tokens
      - tug-data:/data
    depends_on:
      - control

  vps-a:
    image: tug-fake-vps:integration
    build:
      context: .
      dockerfile: tools/docker/fake-vps/Dockerfile
    privileged: true
    environment:
      TUG_NODE_NAME: vps-a
      TUG_APPLY: "true"
      TUG_POLL_INTERVAL_MS: 2000
    volumes:
      - node-tokens:/tokens:ro
      - vps-a-docker:/var/lib/docker
      - vps-a-state:/var/lib/tug
    depends_on:
      - provisioner

  vps-b:
    image: tug-fake-vps:integration
    build:
      context: .
      dockerfile: tools/docker/fake-vps/Dockerfile
    privileged: true
    environment:
      TUG_NODE_NAME: vps-b
      TUG_APPLY: "true"
      TUG_POLL_INTERVAL_MS: 2000
    volumes:
      - node-tokens:/tokens:ro
      - vps-b-docker:/var/lib/docker
      - vps-b-state:/var/lib/tug
    depends_on:
      - provisioner

  vps-c:
    image: tug-fake-vps:integration
    build:
      context: .
      dockerfile: tools/docker/fake-vps/Dockerfile
    privileged: true
    environment:
      TUG_NODE_NAME: vps-c
      TUG_APPLY: "true"
      TUG_POLL_INTERVAL_MS: 2000
    volumes:
      - node-tokens:/tokens:ro
      - vps-c-docker:/var/lib/docker
      - vps-c-state:/var/lib/tug
    depends_on:
      - provisioner

networks:
  default:
    ipam:
      config:
        - subnet: ${TUG_TEST_SUBNET:-10.89.240.0/24}

volumes:
  tug-data:
  node-tokens:
  vps-a-docker:
  vps-a-state:
  vps-b-docker:
  vps-b-state:
  vps-c-docker:
  vps-c-state:
