services:
  control:
    image: {{IMAGE}}
    restart: unless-stopped
    command: control
    environment:
      PORT: 8443
      TUG_DATA_DIR: /data
      TUG_CONTROL_URL: {{CONTROL_URL}}
      TUG_EXTRA_SANS: {{EXTRA_SANS}}
    ports:
      - "{{PORT}}:8443"
    volumes:
      - tug-control:/data
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  tug-control:
    external: true
