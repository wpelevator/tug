services:
  control:
    image: {{IMAGE}}
    restart: unless-stopped
    command: control
    environment:
      PORT: 8443
      TUG_DATA_DIR: /data
      TUG_PUBLIC_URL: {{PUBLIC_URL}}
      TUG_EXTRA_SANS: {{EXTRA_SANS}}
      TUG_MESH: {{MESH}}
    ports:
      - "{{PORT}}:8443"
    volumes:
      - /var/lib/tug-control:/data
      - /var/run/docker.sock:/var/run/docker.sock
