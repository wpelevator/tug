services:
  control:
    image: {{IMAGE}}
    restart: unless-stopped
    command: control
    environment:
      PORT: 8080
      TUG_DATA_DIR: /data
      TUG_OPERATOR_TOKEN: {{OPERATOR_TOKEN}}
      TUG_REGISTRY: {{REGISTRY_HOST}}
      TUG_REGISTRY_AUTH_PATH: {{REGISTRY_AUTH_PATH}}
      TUG_REGISTRY_CONTAINER: {{REGISTRY_CONTAINER}}
    ports:
      - "{{PORT}}:8080"
    volumes:
      - /var/lib/tug-control:/data
      - /var/lib/tug-registry-auth:/registry-auth
      - /var/run/docker.sock:/var/run/docker.sock
