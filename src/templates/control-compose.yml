services:
  registry:
    image: registry:3.1.1
    container_name: launchpad-registry
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: launchpad-registry
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
    volumes:
      - /var/lib/launchpad-registry:/var/lib/registry
      - /var/lib/launchpad-registry-auth:/auth
  control:
    image: {{IMAGE}}
    restart: unless-stopped
    command: node src/control.js
    environment:
      PORT: 8080
      LAUNCHPAD_DATA_DIR: /data
      LAUNCHPAD_OPERATOR_TOKEN: {{OPERATOR_TOKEN}}
      LAUNCHPAD_REGISTRY: {{REGISTRY_HOST}}
      LAUNCHPAD_REGISTRY_AUTH_PATH: /registry-auth/htpasswd
      LAUNCHPAD_REGISTRY_CONTAINER: launchpad-registry
    ports:
      - "{{PORT}}:8080"
    volumes:
      - /var/lib/launchpad-control:/data
      - /var/lib/launchpad-registry-auth:/registry-auth
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - registry
