services:
  control:
    image: {{IMAGE}}
    restart: unless-stopped
    command: control
    environment:
      PORT: 8080
      TUG_DATA_DIR: /data
      TUG_OPERATOR_TOKEN: {{OPERATOR_TOKEN}}
      TUG_MESH: {{MESH}}
    ports:
      - "{{PORT}}:8080"
    volumes:
      - /var/lib/tug-control:/data
      - /var/run/docker.sock:/var/run/docker.sock
