# Override for docker-compose.integration.yml that enables cross-node service DNS and a Caddy
# ingress node (vps-c). Used by tools/scripts/integration-network-test.sh.
services:
  control:
    environment:
      TUG_SERVICE_NAMES: "true"
  provisioner:
    environment:
      TUG_INGRESS_NODES: vps-c
