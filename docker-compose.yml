services:
  control:
    build: .
    command: ["control"]
    environment:
      PORT: 8443
      TUG_PUBLIC_URL: ${TUG_PUBLIC_URL:?set TUG_PUBLIC_URL to the https origin clients use, e.g. https://localhost:8443}
      TUG_DATA_DIR: /data
    ports:
      - "8443:8443"
    volumes:
      - tug-data:/data
      - /var/run/docker.sock:/var/run/docker.sock

  agent:
    build: .
    command: ["agent"]
    profiles: ["agent"]
    environment:
      # Connect-only override; the agent's identity (agent.json) carries the verified public URL.
      TUG_CONTROL_URL: https://control:8443
      TUG_NODE_NAME: dev-node
      # First boot: create an identity with `tug node-enroll` and pass the join key (or mount a 0600 file).
      TUG_JOIN_KEY: ${TUG_JOIN_KEY:-}
      TUG_STATE_DIR: /var/lib/tug
      TUG_APPLY: "false"
      TUG_POLL_INTERVAL_MS: 5000
    volumes:
      - agent-state:/var/lib/tug
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - control

volumes:
  tug-data:
  agent-state:
