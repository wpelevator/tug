services:
  registry:
    build: ./services/registry
    container_name: launchpad-registry
    ports:
      - "5000:5000"
    volumes:
      - registry-data:/var/lib/registry
      - registry-auth:/auth

  control:
    build: .
    command: ["control"]
    environment:
      PORT: 8080
      LAUNCHPAD_DATA_DIR: /data
      LAUNCHPAD_REGISTRY: localhost:5000
      LAUNCHPAD_PUSH: "false"
      LAUNCHPAD_REGISTRY_AUTH_PATH: /registry-auth/htpasswd
      LAUNCHPAD_REGISTRY_CONTAINER: launchpad-registry
      # Set both to terminate TLS directly in control.js instead of relying on Caddy/ACME
      # (e.g. private networks without a public domain). Use a self-signed cert and point
      # agents at it with LAUNCHPAD_CONTROL_URL=https://... plus NODE_EXTRA_CA_CERTS=<ca.pem>.
      # LAUNCHPAD_TLS_CERT_FILE: /data/tls/cert.pem
      # LAUNCHPAD_TLS_KEY_FILE: /data/tls/key.pem
    ports:
      - "8080:8080"
    volumes:
      - launchpad-data:/data
      - registry-auth:/registry-auth
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - registry

  agent:
    build: .
    command: ["agent"]
    profiles: ["agent"]
    environment:
      LAUNCHPAD_CONTROL_URL: http://control:8080
      LAUNCHPAD_NODE_NAME: dev-node
      LAUNCHPAD_AGENT_TOKEN: ${LAUNCHPAD_AGENT_TOKEN:-}
      LAUNCHPAD_STATE_DIR: /var/lib/launchpad
      LAUNCHPAD_APPLY: "false"
      LAUNCHPAD_POLL_INTERVAL_MS: 5000
    volumes:
      - agent-state:/var/lib/launchpad
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - control

volumes:
  launchpad-data:
  registry-data:
  registry-auth:
  agent-state:
