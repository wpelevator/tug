services:
  control:
    image: tug-runtime:integration
    build: .
    command: control
    environment:
      PORT: 8443
      TUG_DATA_DIR: /data
      TUG_PUBLIC_URL: https://control:8443
    ports:
      - "127.0.0.1:${TUG_IMAGE_TEST_PORT:-18081}:8443"
    volumes:
      - control-data:/data
      - /var/run/docker.sock:/var/run/docker.sock

  provisioner:
    image: tug-runtime:integration
    build: .
    entrypoint: ["node"]
    command: ["tools/scripts/integration-provision.js"]
    environment:
      TUG_CONTROL_URL: https://control:8443
      TUG_PUBLIC_URL: https://control:8443
      TUG_DATA_DIR: /data
      TUG_TOKEN_DIR: /tokens
      TUG_NODES: image-node
    volumes:
      - node-tokens:/tokens
      - control-data:/data
    depends_on:
      - control

  node:
    image: tug-fake-vps:integration
    build:
      context: .
      dockerfile: tools/docker/fake-vps/Dockerfile
    privileged: true
    tmpfs:
      - /run
    environment:
      TUG_NODE_NAME: image-node
      TUG_APPLY: "true"
      TUG_POLL_INTERVAL_MS: 500
    volumes:
      - node-tokens:/tokens:ro
      - node-docker:/var/lib/docker
      - node-state:/var/lib/tug
    depends_on:
      - provisioner

volumes:
  control-data:
  node-tokens:
  node-docker:
  node-state:
