# Replace the node, ingress host, S3 endpoint, bucket and region before deploying.
x-tug:
  rollback: auto
  backup:
    schedule: "0 3 * * *"
    retention:
      daily: 7
      weekly: 4
      monthly: 6

services:
  db:
    image: mariadb:11.4.8
    environment:
      MARIADB_DATABASE: app
      MARIADB_USER: app
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - "db-data:/var/lib/mysql"
    x-tug:
      placement:
        nodes:
          - app
      health:
        type: tcp
        port: 3306
      backup:
        command: mariadb-dump -uroot -p"$$MARIADB_ROOT_PASSWORD" --single-transaction --quick --routines --events --triggers --add-drop-database --databases app
        filename: app.sql
        verify: "-- Dump completed"
        restore: mariadb -uroot -p"$$MARIADB_ROOT_PASSWORD"

  redis:
    image: redis:7-alpine
    x-tug:
      placement:
        nodes:
          - app
      health:
        type: tcp
        port: 6379

  web:
    build: .
    depends_on:
      - db
      - redis
    ports:
      - "8080:8000"
    environment:
      APP_KEY: ${APP_KEY}
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_DATABASE: app
      DB_USERNAME: app
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_STORE: redis
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_CACHE_DB: "0"
      SESSION_DRIVER: array
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: tug-example
      AWS_ENDPOINT: https://s3.example.com
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
    x-tug:
      placement:
        nodes:
          - app
      health:
        type: http
        port: 8000
        path: /health
      ingress:
        host: laravel.example.com
        port: 8000
        tls: auto

volumes:
  db-data:
    x-tug:
      placement:
        nodes:
          - app
