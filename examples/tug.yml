# Commit this file; keep the API token out of it.
# Put the token in tug.local.yml (git-ignored, written by `tug init`) or export TUG_TOKEN.
# Each key is the camelCase of the CLI flag it supplies a default for; a flag always wins.
controlUrl: https://control.example.com
project: site

# Defaults for `tug deploy` (`--file`, `--build-local`, `--no-wait`) and `tug rollback` (`--no-wait`).
file: docker-compose.yml
wait: true

# Applied to every node unless the node sets the same key.
nodeDefaults:
  installDocker: true # --install-docker
  # image: ghcr.io/wpelevator/tug:0.5.0
  # mesh: true

# Read only by node-install, node-register and node-enroll, as if typed on the command line:
#   tug node-install --name app1
nodes:
  app1:
    ssh: root@203.0.113.7
    publicAddress: 203.0.113.7
    label: [web, ingress]
  app2:
    ssh: root@203.0.113.8
    address: 10.0.0.8
