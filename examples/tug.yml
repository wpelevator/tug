# Commit this file; keep the operator credential out of it.
# `tug setup` and `tug init <credential-file>` point tug.local.yml (untracked) at the credential; CI exports TUG_CREDENTIAL.
# Each key is the camelCase of the CLI flag it supplies a default for; a flag always wins.
# Where control is: the CLI connects here, and control setup advertises it (--control-url overrides).
controlUrl: https://control.example.com
project: site

# Defaults for `tug deploy` (`--file`, `--build-local`, `--no-wait`) and `tug rollback` (`--no-wait`).
file: docker-compose.yml
wait: true

# Applied to every node unless the node sets the same key.
nodeDefaults:
  installDocker: true # --install-docker
  # image: ghcr.io/wpelevator/tug:0.5.0

# Read only by node add, node replace, node repair, node register and
# node enroll, as if typed on the command line:
#   tug node add --name app1
nodes:
  app1:
    ssh: root@203.0.113.7
    address: 10.0.0.7 # private inter-node address on your network
    label:
      - web
      - ingress
  app2:
    ssh: root@203.0.113.8
    address: 10.0.0.8
