name: Example benchmarks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: example-benchmarks-main
  cancel-in-progress: false

jobs:
  benchmark:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BENCH_SECONDS: '5'
      BENCH_ROUNDS: '3'
      BENCH_CONCURRENCY: '1,16'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          node-version: '24'
      - run: npm run test:benchmarks
      - name: Remove checked-in reference reports from this run's output
        run: |
          node -e "require('node:fs').rmSync('benchmarks/examples/results', { recursive: true, force: true })"
      - run: npm run benchmark:examples
      - name: Save raw reports, including partial failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: example-benchmarks-${{ github.sha }}
          path: benchmarks/examples/results/*.json
          retention-days: 30
