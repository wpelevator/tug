name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # engines.node is the oldest version; .nvmrc is the one used for development and the other jobs.
        node: ['22.18.0', 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - if: matrix.node == 24
        run: npm run typecheck
      - if: matrix.node == 24
        run: npm run lint
      - run: npm test
      - run: npm run test:smoke:dist

  integration:
    name: Integration (fake VPS containers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TUG_COMPOSE_BUILD: ''
      TUG_RUNTIME_IMAGE: tug-runtime:integration
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/build-images
        with:
          runtime: true
          fake-vps: true
      - run: npm run test:smoke:image
      - run: npm run test:integration

  integration-backups:
    name: Integration (backups and one-off runs)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run test:integration:backups

  integration-network:
    name: Integration (WireGuard mesh)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TUG_COMPOSE_BUILD: ''
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/build-images
        with:
          runtime: true
          fake-vps: true
      - run: npm run test:integration:network

  integration-no-registry:
    name: Integration (registry-free image delivery)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TUG_COMPOSE_BUILD: ''
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/build-images
        with:
          runtime: true
          fake-vps: true
      - run: npm run test:integration:no-registry

  integration-rollout:
    name: Integration (rolling rollouts)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TUG_COMPOSE_BUILD: ''
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/build-images
        with:
          runtime: true
          fake-vps: true
      - run: npm run test:integration:rollout
