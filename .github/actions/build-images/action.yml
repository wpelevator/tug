name: Build integration images
description: >-
  Build the images the integration tests run (runtime, fake VPS, registry) into the local Docker daemon with a shared GitHub
  Actions layer cache. Only pushes to main write the cache; pull requests read it, because a pull request cannot read another
  pull request's cache. The scopes match the ones in release.yml so releases reuse the same layers.

inputs:
  runtime:
    description: Build the runtime image (tug-runtime:integration).
    default: 'false'
  fake-vps:
    description: Build the fake VPS image (tug-fake-vps:integration).
    default: 'false'
  registry:
    description: Build the local registry image (tug-registry:integration).
    default: 'false'

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v4
    - if: inputs.runtime == 'true'
      uses: docker/build-push-action@v7
      with:
        context: .
        load: true
        tags: tug-runtime:integration
        cache-from: type=gha,scope=runtime
        cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,scope=runtime,mode=max' || '' }}
    - if: inputs.fake-vps == 'true'
      uses: docker/build-push-action@v7
      with:
        context: .
        file: tools/docker/fake-vps/Dockerfile
        load: true
        tags: tug-fake-vps:integration
        cache-from: type=gha,scope=fake-vps
        cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,scope=fake-vps,mode=max' || '' }}
    - if: inputs.registry == 'true'
      uses: docker/build-push-action@v7
      with:
        context: tools/docker/registry
        load: true
        tags: tug-registry:integration
        cache-from: type=gha,scope=registry
        cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,scope=registry,mode=max' || '' }}
