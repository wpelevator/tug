name: Set up Node.js and dependencies
description: Install Node.js with the npm download cache and run npm ci.

inputs:
  node-version:
    description: Node.js version to install; when empty, setup-node falls back to .nvmrc.
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: .nvmrc
        cache: npm
    - run: npm ci --prefer-offline --no-audit --no-fund
      shell: bash
