name: Set up Node.js and dependencies
description: Install Node.js with the npm download cache and run npm ci.

inputs:
  node-version:
    description: Node.js version to install; defaults to the version in .nvmrc.
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.node-version == '' && '.nvmrc' || '' }}
        cache: npm
    - run: npm ci --prefer-offline --no-audit --no-fund
      shell: bash
